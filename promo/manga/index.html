<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マンガ：ある幹事さんのお話｜DXベアーズ</title>
<meta name="description" content="山の会の幹事さんの出欠のとりまとめ、係、マイカー代の精算が、スマホでどう変わるか。1分で読めるマンガでご紹介します。">
<link rel="canonical" href="https://dxbears1972-maker.github.io/ohc-calendar/promo/manga/">
<meta property="og:title" content="マンガ：ある幹事さんのお話｜DXベアーズ">
<meta property="og:description" content="山の会の幹事さんの出欠のとりまとめ、係、マイカー代の精算が、スマホでどう変わるか。1分で読めるマンガでご紹介します。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://dxbears1972-maker.github.io/ohc-calendar/promo/ogp.png">
<meta property="og:url" content="https://dxbears1972-maker.github.io/ohc-calendar/promo/manga/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../dxbears-mark.svg" type="image/svg+xml">
<style>
:root{
  --green:#1a5c3d; --green2:#2d7d54; --cream:#faf7f0;
  --ink:#1c201e; --gray:#5f6964; --orange:#c86a1e; --line:#dfe4e0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  background:var(--cream); color:var(--ink);
  font-size:19px; line-height:1.9; -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
img{max-width:100%;height:auto;display:block}

/* hero */
.hero{background:var(--green);color:#fff;padding:44px 0 40px;text-align:center}
.hero .club{font-size:17px;color:#b9d6c5;letter-spacing:.08em}
.hero h1{font-size:32px;line-height:1.5;margin:14px 0 6px;font-weight:700}
.hero h1 .big{display:block;font-size:44px;margin-top:6px}
.hero p{font-size:19px;color:#d7e8de;margin-top:16px}
.herofact{display:block;margin:26px auto 0;background:#fff;color:var(--ink);border-radius:14px;padding:16px 20px 18px;max-width:600px;text-align:left}
.herofact .lbl{display:block;font-size:20px;font-weight:700;color:var(--green);line-height:1.45;text-align:center}
.herofact .src{display:block;font-size:15px;color:var(--gray);margin-top:6px;line-height:1.6;text-align:center}
.herofact .fact{display:block;font-size:18px;margin-top:10px;line-height:1.7}
.herofact .fact b{color:var(--orange)}
.herofact a{display:block;margin-top:10px;font-size:17px;font-weight:700;color:var(--green);text-align:center}
.hero p,.herofact .lbl,.herofact .src{word-break:auto-phrase;text-wrap:balance}
.prob.top{border-left-color:var(--green)}
@media(min-width:700px){.prob.top{grid-column:1/-1}}
.badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.badge{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.5);
  border-radius:999px;padding:7px 18px;font-size:16px;font-weight:700}

/* sections */
section{padding:48px 0}
section:nth-of-type(even){background:#fff}
h2{font-size:29px;color:var(--green);text-align:center;line-height:1.5}
.lead{text-align:center;color:var(--gray);margin-top:10px;font-size:18px}

/* problem list */
.problems{margin-top:30px;display:grid;gap:16px}
.prob{background:#fff;border:2px solid var(--line);border-left:8px solid var(--orange);
  border-radius:10px;padding:18px 22px}
section:nth-of-type(even) .prob{background:var(--cream)}
.prob b{display:block;font-size:21px;margin-bottom:4px}
.prob span{color:var(--gray);font-size:17px}

/* feature cards */
.feats{margin-top:32px;display:grid;gap:22px}
.feat{background:#fff;border:3px solid var(--green2);border-radius:16px;overflow:hidden}
section:nth-of-type(even) .feat{background:var(--cream)}
.feat h3{background:var(--green2);color:#fff;font-size:23px;padding:14px 22px}
.feat .body{padding:22px}
.feat ul{list-style:none;margin-top:6px}
.feat li{padding-left:30px;position:relative;margin-bottom:12px;font-size:18px}
.feat li::before{content:"";position:absolute;left:0;top:11px;
  width:15px;height:15px;background:var(--orange);border-radius:3px}

/* calc demo */
.calc{background:#fff;border:2px solid var(--line);border-radius:14px;padding:22px;margin-top:8px}
section:nth-of-type(even) .calc{background:var(--cream)}
.row{display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-bottom:1px dashed var(--line);font-size:18px}
.row:last-of-type{border-bottom:none}
.row .v{font-weight:700;color:var(--green2);font-size:20px}
.result{background:var(--green);color:#fff;border-radius:12px;
  text-align:center;padding:16px;margin-top:16px}
.result small{display:block;font-size:16px;color:#b9d6c5}
.result strong{font-size:34px;letter-spacing:.02em}

/* price */
.pricebox{margin-top:30px;background:#fff;border:4px solid var(--green);
  border-radius:18px;overflow:hidden;text-align:center}
section:nth-of-type(even) .pricebox{background:var(--cream)}
.pricebox .free{background:var(--orange);color:#fff;padding:16px;font-size:26px;font-weight:700}
.pricebox .amount{padding:26px 20px 8px}
.pricebox .amount .yen{font-size:56px;font-weight:700;color:var(--green);letter-spacing:.01em}
.pricebox .amount .unit{font-size:22px;color:var(--ink);margin-left:6px}
.pricebox .per{color:var(--gray);font-size:18px;padding-bottom:22px}
.pricebox .setupfee{border-top:2px dashed var(--green);margin:0 20px;padding:18px 0 20px}
.pricebox .setupfee>b{font-size:24px;color:var(--ink)}
.pricebox .setupfee span.d b{font-size:inherit;color:var(--ink)}
.pricebox .setupfee .once{display:block;margin-top:4px;font-size:17px;color:var(--gray)}
.pricebox .setupfee span.d{display:block;margin-top:8px;color:var(--gray);font-size:17px;line-height:1.7}
.pricelist{list-style:none;text-align:left;padding:0 24px 26px;max-width:520px;margin:0 auto}
.pricelist li{padding-left:30px;position:relative;margin-bottom:12px;font-size:18px}
.pricelist li::before{content:"";position:absolute;left:0;top:11px;
  width:15px;height:15px;background:var(--orange);border-radius:3px}

/* steps */
.steps{margin-top:32px;display:grid;gap:18px;counter-reset:s}
.step{background:#fff;border:2px solid var(--line);border-radius:14px;
  padding:20px 22px 20px 78px;position:relative}
section:nth-of-type(even) .step{background:var(--cream)}
.step::before{counter-increment:s;content:counter(s);
  position:absolute;left:20px;top:20px;width:42px;height:42px;
  background:var(--green);color:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.step b{display:block;font-size:21px;margin-bottom:4px}
.step span{color:var(--gray);font-size:17px}
.stepnote{margin-top:20px;background:var(--cream);border:2px solid var(--line);
  border-radius:12px;padding:16px 20px;font-size:17px;line-height:1.8;color:var(--ink)}
section:nth-of-type(even) .stepnote{background:#fff}

/* faq */
.faq{margin-top:28px}
.faq details{background:#fff;border:2px solid var(--line);border-radius:12px;
  margin-bottom:14px;padding:0}
section:nth-of-type(even) .faq details{background:var(--cream)}
.faq summary{font-size:20px;font-weight:700;padding:18px 22px;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"Q ";color:var(--orange);font-weight:700}
.faq .a{padding:0 22px 20px;color:var(--gray);font-size:17px}

/* cta */
.cta{background:var(--green);color:#fff;text-align:center;padding:52px 0}
.cta h2{color:#fff}
.cta p{color:#d7e8de;margin-top:12px;font-size:18px}
.btn{display:inline-block;background:var(--orange);color:#fff;text-decoration:none;
  font-size:23px;font-weight:700;padding:20px 44px;border-radius:14px;margin-top:26px;
  border:3px solid #fff}
.note{font-size:16px;color:#b9d6c5;margin-top:18px}

/* 特商法表記 */
.legal{background:#f1efe8;padding:40px 0 44px}
.legal h2{font-size:23px;color:var(--gray);margin-bottom:18px}
.legal table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.8}
.legal th,.legal td{border:1px solid #d8d5cc;padding:10px 12px;text-align:left;vertical-align:top}
.legal th{background:#e7e4da;color:var(--ink);font-weight:700;width:34%;white-space:nowrap}
.legal td{background:#fff;color:var(--gray)}

footer{background:#12402b;color:#9dbfad;text-align:center;padding:28px 0;font-size:16px}
footer a{color:#cfe3d8}

@media(max-width:520px){
  .legal th,.legal td{display:block;width:100%;border-top:none}
  .legal th{border-top:1px solid #d8d5cc}
}

@media(min-width:700px){
  .problems{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:repeat(3,1fr)}
  .hero h1{font-size:36px}
  .hero h1 .big{font-size:52px}
}
/* ===== 漫画（幹事編）2026-09-28 ===== */
.manga{background:#fff;padding:48px 0 40px}
.manga h2 .sub{display:block;font-size:19px;color:var(--gray);font-weight:400;margin-top:4px}
.komas{max-width:560px;margin:28px auto 0;display:grid;gap:30px}
.koma{margin:0;background:var(--cream);border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.koma figcaption{background:var(--ink);color:#fff;font-size:22px;font-weight:700;line-height:1.5;padding:10px 16px}
.koma figcaption .no{display:inline-block;background:var(--orange);border-radius:6px;font-size:16px;padding:0 10px;margin-right:10px;vertical-align:2px}
.koma figcaption em{font-style:normal;color:#ffd08a}
.koma .scene{display:block;width:100%;height:auto;border-bottom:3px solid var(--ink);background:#fff}
.koma .say{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;
  margin:18px 14px 6px;padding:12px 16px;font-size:21px;line-height:1.7;font-weight:700}
.koma .say .who{display:block;font-size:15px;color:var(--gray);font-weight:700;line-height:1.4}
.koma .say::before{content:"";position:absolute;top:-17px;width:0;height:0;
  border:14px solid transparent;border-bottom:16px solid var(--ink);border-top:0}
.koma .say::after{content:"";position:absolute;top:-11px;width:0;height:0;
  border:10px solid transparent;border-bottom:12px solid #fff;border-top:0}
.koma .say.l{margin-right:40px}.koma .say.l::before{left:30px}.koma .say.l::after{left:34px}
.koma .say.r{margin-left:40px}.koma .say.r::before{right:30px}.koma .say.r::after{right:34px}
.koma .say.c::before{left:calc(50% - 14px)}.koma .say.c::after{left:calc(50% - 10px)}
.koma .nar{margin:14px 14px 16px;background:#fffbe8;border-left:6px solid var(--orange);
  padding:10px 14px;font-size:19px;line-height:1.8}
.koma .nar small{font-size:16px;color:var(--gray)}
.koma > :last-child{margin-bottom:18px}
/* 絵の中の吹き出し */
.koma .pic .scene{border-bottom:0}
.koma .pic{position:relative;border-bottom:3px solid var(--ink);background:#fff}
.koma .pic img,.koma .pic svg{display:block;width:100%;height:auto}
.koma .pic .b{position:absolute;background:#fff;border:2.5px solid var(--ink);border-radius:16px;
  font-weight:700;line-height:1.35;padding:5px 11px;font-size:clamp(17px,5.2vw,25px);
  box-shadow:0 2px 0 rgba(0,0,0,.15)}
.koma .pic .b::after{content:"";position:absolute;width:12px;height:12px;background:#fff;
  border:2.5px solid var(--ink);border-width:0 2.5px 2.5px 0}
.koma .pic .b.t-dr::after{bottom:-8px;right:22px;transform:rotate(45deg)}
.koma .pic .b.t-dl::after{bottom:-8px;left:22px;transform:rotate(45deg)}
.koma .pic .b.t-dc::after{bottom:-8px;left:calc(50% - 6px);transform:rotate(45deg)}
.koma .pic .b.t-ur::after{top:-8px;right:22px;transform:rotate(-135deg)}
.koma .pic .b.t-ul::after{top:-8px;left:22px;transform:rotate(-135deg)}
.bigbtns{display:flex;gap:8px;justify-content:center;margin:18px 12px 0}
.bigbtns span{flex:1;text-align:center;border-radius:12px;color:#fff;font-weight:700;
  font-size:24px;padding:14px 4px;line-height:1.2;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.bigbtns .b-yes{background:#2e6b34}.bigbtns .b-maybe{background:#e8a000}.bigbtns .b-no{background:#888}
.koma.big{border-color:var(--orange);border-width:4px}
.koma.big figcaption{background:var(--orange)}
.koma.big figcaption .no{background:var(--ink)}
.ph{max-width:330px;margin:18px auto 0;background:#2b2b2b;border-radius:26px;padding:12px}
.ph-scr{background:#fff;border-radius:16px;padding:14px 14px 16px;font-size:18px;line-height:1.8}
.ph .ev-t{background:var(--green);color:#fff;font-weight:700;border-radius:8px;padding:6px 10px;margin-bottom:10px}
.ph .att{font-size:18px}
.ph .c-yes{color:#2e6b34}.ph .c-maybe{color:#b87d00}.ph .c-no{color:#666}.ph .c-pend{color:#c33}
.ph .ph-btn,.ph .ph-file{margin-top:12px;border:2px solid var(--green2);color:var(--green);border-radius:10px;
  text-align:center;font-weight:700;padding:8px}
.ph .pp{background:var(--green);color:#fff;border-radius:10px;text-align:center;padding:8px;margin-bottom:10px}
.ph .pp small{display:block;font-size:15px;color:#cfe3d8}.ph .pp strong{font-size:30px}
.nw{white-space:nowrap}
.koma figcaption,.manga .fine,.koma .say,.koma .nar{text-wrap:pretty}
.manga .fine{max-width:560px;margin:22px auto 0;font-size:16px;color:var(--gray);text-align:center}
.manga .next{display:block;max-width:560px;margin:18px auto 0;text-align:center;font-size:20px;font-weight:700;color:var(--green)}
@media(max-width:380px){.koma .say{font-size:19px}.bigbtns span{font-size:20px}.koma figcaption{font-size:20px}}
/* 本物の画面のアップ（2026-09-29） */
.up{margin:14px 6px 0}
.up-cap{text-align:center;font-size:17px;font-weight:700;color:var(--green)}
.ph .ph-img{padding:0;overflow:hidden;line-height:0}
.ph .ph-img img{display:block;width:100%;height:auto}
.up .ph{margin-top:6px;max-width:420px;padding:6px;border-radius:18px}
.up .ph .ph-img{border-radius:12px}
/* ===== 漫画ここまで ===== */
/* ===== ヘッダーとメニュー（2026-09-30。決定P1・P2・P6・P7） ===== */
html{scroll-padding-top:165px}
/* 1字だけ次の行へ落ちるのを防ぐ（2026-09-30 只隈さん「る　だけが改行されるような場所が多い」）
   見出しは balance＋auto-phrase（文節で折り、行の長さをそろえる）。本文は pretty だけ（最後の行を1字にしない。文節で折ると右が大きく空くので本文には使わない） */
h1,h2,h3,summary,.prob b,.step b,.feat h3,.card b,.mbanner span,.lead,.faqh,.tocta p,.cta p,.koma figcaption,
.prob span,.step span,.pricebox span.d,.pricebox .per,.pricebox .amount,.setupfee>b,.btn,.manga .next{text-wrap:balance;word-break:auto-phrase}
.row .v{white-space:nowrap}
p,li,.a,.card span,.stepnote,.nar,.say,td{text-wrap:pretty}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.site{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.site-in{max-width:820px;margin:0 auto;padding:6px 4px 7px}
/* ロゴを大きく（決定P12：只隈さん「これが目立たない」） */
.site .brand{display:flex;align-items:center;gap:10px;padding:0 6px 6px;text-decoration:none}
.site .brand img{height:52px;width:auto;display:block}
.site .brand .tag{font-size:clamp(13px,3.8vw,16px);font-weight:700;color:#0D4C30;line-height:1.35;border-left:3px solid #0D4C30;padding-left:10px}
.gnav ul{list-style:none;display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.gnav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;
  background:#0D4C30;color:#fff;border-radius:8px;border-bottom:5px solid #0D4C30;
  padding:6px 0 3px;font-weight:700;font-size:clamp(14px,4.5vw,18px);line-height:1.25;white-space:nowrap}
.gnav a .ic{width:28px;height:28px}
.gnav a[aria-current="page"]{background:var(--orange);border-bottom-color:#6b3207}
.gnav .l{display:none}
@media(min-width:1080px){
  .site-in{max-width:1140px;display:flex;align-items:center;gap:16px;padding:8px 20px}
  .site .brand{padding:0;flex:none}.site .brand img{height:58px}.site .brand .tag{display:none}
  .gnav{flex:1}.gnav ul{grid-template-columns:repeat(6,auto);justify-content:end;gap:6px}
  .gnav a{flex-direction:row;gap:6px;padding:8px 12px 5px;font-size:18px}
  .gnav a .ic{width:24px;height:24px}
  .gnav .l{display:inline}.gnav .s{display:none}
}
.totop{position:fixed;right:12px;bottom:14px;z-index:40;display:flex;flex-direction:column;align-items:center;
  width:64px;height:64px;justify-content:center;border-radius:50%;background:#0D4C30;color:#fff;
  text-decoration:none;font-size:15px;font-weight:700;line-height:1.1;border:3px solid #fff;
  box-shadow:0 3px 10px rgba(0,0,0,.3);opacity:0;visibility:hidden;transition:opacity .2s}
.totop.show{opacity:1;visibility:visible}
.totop .ic{width:24px;height:24px}
footer{padding-bottom:90px}
/* 漫画のバナー（決定P8。漫画のページには出さない） */
.mbw{padding:10px 12px 0}
.mbanner{display:flex;align-items:center;gap:12px;max-width:820px;margin:0 auto 10px;padding:7px 10px 7px 7px;
  background:#fffbe8;border:3px solid var(--orange);border-radius:12px;text-decoration:none;color:var(--ink)}
.mbanner img{width:88px;height:50px;object-fit:cover;border-radius:6px;flex:none}
.mbanner b{display:block;font-size:clamp(16px,4.4vw,19px);white-space:nowrap;color:var(--orange);line-height:1.4}
.mbanner span{display:block;font-size:clamp(15px,4.2vw,16px);line-height:1.45}
/* トップだけ大きく（決定P11：只隈さん「マンガはもっと縦方向に大きく」） */
.mbanner.big{flex-direction:column;align-items:stretch;gap:0;max-width:640px;padding:0;overflow:hidden;position:relative}
.mbanner.big img{width:100%;height:auto;border-radius:0}
.mbanner.big div{padding:10px 44px 12px 14px}
.mbanner.big b{font-size:clamp(19px,5.4vw,24px)}
.mbanner.big span{font-size:clamp(16px,4.6vw,19px)}
.mbanner.big::after{position:absolute;right:12px;bottom:18px}
.mbanner::after{content:"›";margin-left:auto;font-size:34px;color:var(--orange);line-height:1}
h2 .ic,.faqh .ic{color:#0D4C30;margin-right:.3em}
.feat h3 .ic{margin-right:.35em}
/* トップの入口カード */
.cards{margin-top:28px;display:grid;gap:14px}
.card{display:flex;align-items:center;gap:16px;background:#fff;border:3px solid var(--green2);
  border-radius:14px;padding:16px 18px;text-decoration:none;color:var(--ink)}
section:nth-of-type(even) .card{background:var(--cream)}
.card .ic{width:44px;height:44px;color:#0D4C30}
.card b{display:block;font-size:22px;color:var(--green)}
.card span{display:block;color:var(--gray);font-size:17px;line-height:1.6}
.card::after{content:"›";margin-left:auto;font-size:34px;color:var(--green2);line-height:1}
@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}}
/* よくある質問の分類 */
.faqnav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.faqnav a{border:2px solid #cfe0d6;border-radius:999px;padding:4px 14px;font-size:17px;
  color:#0D4C30;text-decoration:none;font-weight:700;background:#fff}
.faqh{font-size:23px;color:var(--green);margin-top:34px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.faqh + .faq{margin-top:16px}
/* ページの下のお誘い */
.tocta{background:var(--green);color:#fff;text-align:center;padding:34px 0 38px}
.tocta p{font-size:21px;font-weight:700}
.tocta .btn{margin-top:16px;font-size:21px;padding:14px 34px}
/* ===== ヘッダーとメニューここまで ===== */
</style>
</head>
<body>

<header class="site"><div class="site-in">

<!-- ===== 漫画（幹事編）2026-09-28。登場する人の名前は架空 ===== -->
<div class="manga" id="manga">
  <div class="wrap">
    <h2><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2z"/><path d="M22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/></svg>まずは、ある幹事さんのお話から<span class="sub">マンガ・1分で読めます</span></h2>
    <div class="komas">
      <figure class="koma "><figcaption><span class="no">はじまり</span>次の山を決めよう！</figcaption><div class="pic"><img src="01b.jpg" width="1100" height="614" loading="eager" alt=""></div><p class="nar">ある山の会の、幹事さんのお話です。例会で、次の山が決まりました。</p></figure>
      <figure class="koma "><figcaption><span class="no">その1</span>連絡が、流れていく</figcaption><div class="pic"><img src="03b.jpg" width="1100" height="614" loading="lazy" alt=""></div><p class="nar">山行のお知らせは、紙で配ったり、LINEで流したり。大事な連絡ほど、どこへ行ったか分からなくなる。</p></figure>
      <figure class="koma "><figcaption><span class="no">その2</span>出欠の集計が、山のよう</figcaption><div class="pic"><img src="02b.jpg" width="1100" height="614" loading="lazy" alt=""></div><p class="nar">出欠は、紙の表に書いてもらったり、電話で聞いたり。人数が分からないと、<b>車の台数も、運転を頼む人も</b>決められない。係も計画書も、そのあと。</p></figure>
      <figure class="koma "><figcaption><span class="no">その3</span>山の会のための、予定表</figcaption><div class="pic"><img src="04b.jpg" width="1100" height="614" loading="lazy" alt=""></div><div class="up"><div class="up-cap">▼ QRコードを読むと、この画面</div><div class="ph"><div class="ph-scr ph-img"><img src="scr_cal.png" alt="山の会の予定が入ったカレンダーの画面" loading="lazy"></div></div></div><p class="nar"><b>スマホのカメラでQRコードを読むだけ</b>。インストールはいりません。<b>会員の方は、はじめにご自分の名前を選ぶだけ。パスワードもいりません。</b>予定のある日には、山の名前が出ます。</p></figure>
      <figure class="koma big"><figcaption><span class="no">その4</span>会員さんは、<em>押すだけ</em></figcaption><div class="pic"><img src="05b.jpg" width="1100" height="614" loading="lazy" alt=""></div><div class="up"><div class="up-cap">▼ 会員さんの画面</div><div class="ph"><div class="ph-scr ph-img"><img src="scr_btn.png" alt="予定の下に、○参加・△未定・×不参加のボタンが並んだ画面" loading="lazy"></div></div></div><p class="nar">会員さんは、<b>3つのボタンのどれかを押すだけ</b>。覚えることは、これだけです。</p></figure>
      <figure class="koma "><figcaption><span class="no">その5</span>人数も、車の席も、すぐ分かる</figcaption><div class="pic"><img src="06b.jpg" width="1100" height="614" loading="lazy" alt=""></div><div class="up"><div class="up-cap">▼ 幹事さんの画面</div><div class="ph"><div class="ph-scr ph-img"><img src="scr_list.png" alt="参加6人・未定1人・不参加2人・未回答2人の名前と、車2台・席7／参加6人 足りています、と出た画面" loading="lazy"></div></div></div><p class="nar">答えは、その場で一覧に。参加の方は「車を出せる（何人乗り）」も選べるので、<b>車の台数と、席が足りるかまで分かります。</b>人数と顔ぶれが早く分かるから、係も早く決まる。</p></figure>
      <figure class="koma "><figcaption><span class="no">その6</span>まだの方へ、ボタン1回</figcaption><div class="pic"><img src="07b.jpg" width="1100" height="614" loading="lazy" alt=""></div><div class="up"><div class="up-cap">▼ 幹事さんの画面</div><div class="ph"><div class="ph-scr ph-img"><img src="scr_line.png" alt="未回答の2人へ直接LINEを送るボタンがある画面" loading="lazy"></div></div></div><p class="nar">まだの方へは、LINEで直接。電話で聞いた答えは、<b>幹事さんが代わりに入れられます</b>。</p></figure>
      <figure class="koma "><figcaption><span class="no">その7</span>係も計画書も、画面に</figcaption><div class="pic"><img src="08b.jpg" width="1100" height="614" loading="lazy" alt=""></div><div class="up"><div class="up-cap">▼ みんなの画面</div><div class="ph"><div class="ph-scr ph-img"><img src="scr_staff.png" alt="係（リーダー・サブリーダー・会計）と計画表のボタンがある画面" loading="lazy"></div></div></div><p class="nar">係の名前も、計画書も、予定の中に。<b>当日の朝も、スマホを見れば分かります。</b></p></figure>
      <figure class="koma "><figcaption><span class="no">その8</span>帰りの車代も、その場で</figcaption><div class="pic"><img src="09b.jpg" width="1100" height="614" loading="lazy" alt=""></div><div class="up"><div class="up-cap">▼ マイカー精算の画面</div><div class="ph"><div class="ph-scr ph-img"><img src="scr_car.png" alt="一人あたりの支払い1,200円、山田さん受け取り3,600円と出た精算の画面" loading="lazy"></div></div></div><p class="nar">乗せてもらった3人が、<b><span class=nw>1,200円ずつ</span>山田さんへ</b>。<br>山田さんは、<b>合わせて<span class=nw>3,600円</span>を受け取ります</b>。<br><small>（ガソリン代〈往復の距離×1kmあたりの単価〉と高速代を足した車の費用 4,800円を、4人で分けた例です。1kmあたりの単価は、クラブの決まりに合わせて変えられます。）</small></p></figure>
      <figure class="koma "><figcaption><span class="no">完</span>思いきり山を楽しもう！</figcaption><div class="pic"><img src="10b.jpg" width="1100" height="614" loading="lazy" alt=""></div></figure>
    </div>
    <p class="fine">※ たとえ話です。登場する人の名前は架空です。</p>
